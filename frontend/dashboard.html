
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITSM | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <h2>ITSM Portal</h2>
        <nav>
            <a class="active" href="dashboard.html">Dashboard</a>
            <a href="tickets.html">Tickets</a>
            <a href="create-ticket.html">Create Ticket</a>
            <a href="#" id="logoutLink">Sign out</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div>
                <h1>Dashboard</h1>
                <p class="muted">IT support operations overview</p>
            </div>
            <a href="create-ticket.html" class="btn btn-primary">
                + New ticket
            </a>
        </header>

        <section class="stats-grid">
            <article class="stat-card">
                <span class="muted">Total tickets</span>
                <strong class="stat-value" id="totalTickets">—</strong>
            </article>
            <article class="stat-card">
                <span class="muted">Open tickets</span>
                <strong class="stat-value" id="openTickets">—</strong>
            </article>
            <article class="stat-card">
                <span class="muted">Critical tickets</span>
                <strong class="stat-value" id="criticalTickets">—</strong>
            </article>
        </section>

        <section class="panel">
            <h2>Tickets by status</h2>
            <div id="statusList">Loading dashboard...</div>
            <p id="dashboardError" class="error" role="alert"></p>
        </section>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
