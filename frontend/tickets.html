
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ITSM | Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <h2>ITSM Portal</h2>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a class="active" href="tickets.html">Tickets</a>
            <a href="create-ticket.html">Create Ticket</a>
            <a href="#" id="logoutLink">Sign out</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="section-heading">
            <div>
                <h1>Ticket Management</h1>
                <p class="muted">View and filter support tickets</p>
            </div>
            <a href="create-ticket.html" class="btn btn-primary">
                + Create ticket
            </a>
        </header>

        <section class="panel">
            <form id="filterForm">
                <label for="search">Search by title or ticket number</label>
                <input id="search" placeholder="Search tickets...">

                <label for="status">Status</label>
                <select id="status">
                    <option value="">All statuses</option>
                    <option>NEW</option>
                    <option>TRIAGED</option>
                    <option>ASSIGNED</option>
                    <option>IN PROGRESS</option>
                    <option>PENDING</option>
                    <option>RESOLVED</option>
                    <option>CLOSED</option>
                </select>

                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="">All priorities</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>

                <div class="form-actions">
                    <button class="btn btn-primary" type="submit">
                        Apply filters
                    </button>
                </div>
            </form>
        </section>

        <p id="ticketError" class="error" role="alert"></p>

        <section class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Title</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody id="ticketRows"></tbody>
            </table>
        </section>

        <div class="form-actions">
            <button id="previousPage" class="btn" type="button">
                Previous
            </button>
            <span id="pageLabel">Page 1</span>
            <button id="nextPage" class="btn" type="button">
                Next
            </button>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
